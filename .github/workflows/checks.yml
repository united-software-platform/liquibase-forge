# Проверки Liquibase Forge.
#
# Повторяют раздел «Проверки» CONTRIBUTING.md — ровно те задачи mise, что автор прогоняет локально
# до отправки изменений. Совпадение двух перечней сторожит тест tests/release/test_checks_workflow.py:
# новая проверка добавляется в оба места одной правкой.
#
# Запускаются на PR в main, на push в main и из релизного сценария (workflow_call): версия
# не выпускается с коммита, на котором проверки не пройдены.
#
# Инструменты — python, uv, java и liquibase — ставит mise по mise.toml репозитория: в CI та же
# среда, что на рабочем месте разработчика. Перед тестами job поднимает окружение интеграционных
# тестов скриптом tools/ci/integration-env.sh: сервер PostgreSQL машины CI, драйвер Liquibase
# и целевую базу. Скрипт отдаёт тестам учётные данные сервера и FORGE_REQUIRE_INTEGRATION=1:
# пропуск интеграционного теста без окружения здесь — ошибка, а не зелёный прогон. Пропускаются
# с причиной только тесты шаблонов операций, которым нужен CLI backlog плагина formular:
# плагина в CI нет.
name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

# Проверки только читают репозиторий: ни коммитов, ни тегов, ни релизов.
permissions:
  contents: read

jobs:
  checks:
    name: Линтер, форматирование, типы, тесты
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v7

      # Действие ставит mise, устанавливает инструменты, закреплённые в mise.toml, кеширует их
      # и передаёт PATH и переменные следующим шагам job'а. В CI mise доверяет конфигурации
      # репозитория сам. Версия действия точная, как у остальных действий.
      - name: Установка инструментов mise
        uses: jdx/mise-action@v5.3.0

      # --frozen: зависимости ставятся строго по uv.lock, как CLI в целевом проекте. Lock-файл,
      # разошедшийся с pyproject.toml, роняет шаг, а не пересобирается молча.
      - name: Установка зависимостей
        run: uv sync --frozen

      - name: Линтер
        run: mise run lint

      - name: Форматирование
        run: mise run format-check

      - name: Типы
        run: mise run types

      # Окружение живёт до конца job'а: переменные уходят в $GITHUB_ENV. Не поднялось — шаг
      # красный, и до тестов дело не доходит.
      - name: Окружение интеграционных тестов
        run: mise exec -- sh tools/ci/integration-env.sh

      # Без фильтра маркеров: интеграционные тесты исполняются в том же прогоне, а -m "not integration"
      # спрятал бы их молча.
      - name: Тесты
        run: mise run test

      # Без журнала сервера упавший в CI накат не разобрать. Шаг идёт только при сбое и сам
      # не падает: журнала может не быть, если окружение не успело подняться.
      - name: Журналы окружения
        if: failure()
        run: cat .forge/ci/postgresql.log; sudo journalctl -u postgresql --no-pager -n 200 || true
