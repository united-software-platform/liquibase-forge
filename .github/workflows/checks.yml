# Проверки Liquibase Forge.
#
# Повторяют раздел «Проверки» CONTRIBUTING.md — ровно те команды, что автор прогоняет локально
# до отправки изменений. Совпадение двух перечней сторожит тест tests/release/test_checks_workflow.py:
# новая проверка добавляется в оба места одной правкой.
#
# Запускаются на PR в main, на push в main и из релизного сценария (workflow_call): версия
# не выпускается с коммита, на котором проверки не пройдены.
#
# Перед тестами job поднимает окружение интеграционных тестов скриптом tools/ci/integration-env.sh:
# сервер БД lbfr-db-test, образ Liquibase и раннер целей make на машине CI — та же цепочка, что
# локально. Скрипт отдаёт тестам FORGE_TEST_DB_*, AGENT_RUNNER_URL, AGENT_RUNNER_TOKEN
# и FORGE_REQUIRE_INTEGRATION=1: пропуск интеграционного теста без окружения здесь — ошибка,
# а не зелёный прогон. Пропускаются с причиной только тесты шаблонов операций, которым нужен
# CLI backlog плагина formular: плагина в CI нет.
name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

# Проверки только читают репозиторий: ни коммитов, ни тегов, ни релизов.
permissions:
  contents: read

jobs:
  checks:
    name: Линтер, форматирование, типы, тесты, Makefile
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v7

      # Версия uv совпадает с контейнером агента: новый uv может сменить формат uv.lock,
      # и проверка покраснела бы без правки репозитория.
      #
      # Версия действия точная: начиная с v8 Astral не публикует плавающие теги vN и vN.M,
      # а релизы неизменяемы — содержимое закреплённой версии нельзя подменить переносом тега.
      - name: Установка uv и Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.7"
          python-version: "3.12"

      # --frozen: зависимости ставятся строго по uv.lock, как CLI в целевом проекте. Lock-файл,
      # разошедшийся с pyproject.toml, роняет шаг, а не пересобирается молча.
      - name: Установка зависимостей
        run: uv sync --frozen

      - name: Линтер
        run: uv run ruff check

      - name: Форматирование
        run: uv run ruff format --check

      - name: Типы
        run: uv run mypy src

      # Окружение живёт до конца job'а: раннер работает в фоне, переменные уходят в $GITHUB_ENV.
      # Не поднялось — шаг красный, и до тестов дело не доходит.
      - name: Окружение интеграционных тестов
        run: sh tools/ci/integration-env.sh

      # Без фильтра маркеров: интеграционные тесты исполняются в том же прогоне, а -m "not integration"
      # спрятал бы их молча.
      - name: Тесты
        run: uv run pytest

      # Без --max-lines: проверка идёт по норме MAKE-001, храповик MAKE-005 приведён к норме.
      - name: Объём секций Makefile
        run: sh tools/make-lint/check.sh

      # Без журнала раннера и сервера БД упавший в CI накат не разобрать. Шаг идёт только при сбое
      # и сам не падает: журнала может не быть, если окружение не успело подняться.
      - name: Журналы окружения
        if: failure()
        run: cat .forge/ci/runner.log; docker compose logs lbfr-db-test || true
