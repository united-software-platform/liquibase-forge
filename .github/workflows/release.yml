# Релиз версии Liquibase Forge.
#
# Запускается только вручную: релиз — решение человека, а не следствие события репозитория.
# Ручной запуск с явно заданным разрядом и есть то явное решение, которого требует GIT-015;
# отдельных подтверждений внутри прогона поэтому нет. Разряд — единственный ввод: решение
# человека исчерпывается ответами «выпускать» и «какой разряд».
#
# Сообщение релизного коммита не несёт кода и номера задачи: без соответствующего ввода взять
# их неоткуда, а выводить из контекста запрещает GIT-010. Такой коммит описан в правилах Git
# как именованное исключение из формата GIT-009 — см. rules/git-rules.md, «Исключение для
# машинного релизного коммита».
#
# Один прогон делает всё разом: поднимает VERSION, коммитит, ставит аннотированный тег vX.Y.Z,
# публикует его и создаёт GitHub Release. Отсюда согласованность носителей по построению —
# состояния, в котором тег указывает на коммит с другим номером, не возникает, и сторожить его
# проверкой не нужно.
#
# Сценарий повторяет релизный сценарий SDD Developer Kit с двумя отличиями: сборки образа нет —
# образа у forge нет, — а после тега публикуется GitHub Release, по которому установщик находит
# последнюю версию. Третье отличие — гейт ветки: выпуск идёт только из main. Четвёртое — проверки:
# первым job'ом прогоняется workflow checks, и версия не повышается на коммите, где они не пройдены.
# Пятое — гейт задач: версия не выпускается, пока в milestone её номера есть открытые задачи.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Разряд версии
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Права верхнего уровня получают все job'ы, в том числе вызванный workflow проверок, поэтому
# здесь — только чтение. Право на запись нужно ровно job'у release: он коммитит VERSION, публикует
# тег и создаёт релиз; ему же — чтение задач для гейта задач выпуска. Права на запуск пайплайнов,
# как у kit'а, не нужно: сборки образа нет.
permissions:
  contents: read

jobs:
  # Проверки на том же коммите, который выпускается: статус проверок на коммите main мог бы
  # отсутствовать, а копия шагов здесь разошлась бы с checks.yml при первой правке.
  checks:
    name: Проверки
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  release:
    name: Повышение версии, тег и релиз
    needs: checks
    runs-on: ubuntu-latest
    # issues: read — только чтение: гейт задач выпуска читает milestone и его задачи
    permissions:
      contents: write
      issues: read

    steps:
      # Ручной запуск позволяет выбрать любую ветку, а git push origin HEAD опубликовал бы
      # релизный коммит в неё. Прогон завершается ошибкой, а не пропускается молча: запуск
      # не из той ветки виден в статусе.
      - name: Гейт ветки main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] \
              || { echo "Релиз выпускается только из main, запуск из $GITHUB_REF" >&2; exit 1; }

      - name: Получение репозитория
        uses: actions/checkout@v7

      # Входное значение передаётся через env, а не подставляется в текст команды: подстановка
      # выражения ${{ }} прямо в скрипт склеивает данные с кодом, и ввод запускающего оказался бы
      # исполняемым.
      #
      # Значение читается строго как МАЖОР.МИНОР.ПАТЧ: молчаливое додумывание неполного номера
      # дало бы тег, не совпадающий с содержимым файла.
      - name: Разбор текущей версии
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(head -n 1 VERSION | tr -d ' \011\015\012')
          printf '%s\n' "$current" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "VERSION не разбирается как МАЖОР.МИНОР.ПАТЧ: прочитано «$current»" >&2; exit 1; }
          major=${current%%.*}; rest=${current#*.}; minor=${rest%%.*}; patch=${rest#*.}
          case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
          esac
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "$current -> $major.$minor.$patch"

      # Состав выпуска задаёт milestone vX.Y.Z нового номера: выпуск идёт, только когда все его
      # задачи закрыты. Имя берётся из вычисленного номера, поэтому второго ввода у сценария нет.
      # Нет milestone — тоже ошибка: иначе достаточно забыть его завести, и гейт молча выключен.
      # API задач отдаёт и PR, привязанные к milestone: открытый PR — тоже незавершённая работа.
      # NEXT уже проверен как МАЖОР.МИНОР.ПАТЧ, поэтому его подстановка в выражение --jq безопасна.
      - name: Гейт задач выпуска
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          milestone=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" --paginate \
              --jq ".[] | select(.title == \"v$NEXT\") | .number")
          [ -n "$milestone" ] \
              || { echo "Нет milestone v$NEXT: состав выпуска не задан" >&2; exit 1; }
          open=$(gh api "repos/$GITHUB_REPOSITORY/issues?milestone=$milestone&state=open&per_page=100" \
              --paginate --jq '.[] | "#\(.number) \(.title)"')
          [ -z "$open" ] || { echo "В milestone v$NEXT открыты задачи:" >&2
                              echo "$open" >&2; exit 1; }
          echo "Все задачи milestone v$NEXT закрыты"

      # Гейт GIT-020: новая версия не пишется поверх незафиксированной работы.
      - name: Гейт незакоммиченных правок
        run: |
          pending=$(git status --porcelain -- VERSION)
          [ -z "$pending" ] || { echo "В VERSION есть незакоммиченные правки:" >&2
                                 echo "$pending" >&2; exit 1; }

      # Тег публикуется после коммита: если push в main отклонён, тег без коммита не повиснет.
      - name: Запись версии, коммит и тег
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          printf '%s\n' "$NEXT" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Релиз v$NEXT" -m "Версия повышена: $CURRENT -> $NEXT."
          git tag -a "v$NEXT" -m "v$NEXT"
          git push origin HEAD
          git push origin "v$NEXT"

      # Установщик forge без --ref ищет версию через releases/latest: без релиза выпущенная
      # версия ему не видна. Kit этого шага не делает — его установщик по умолчанию берёт main.
      #
      # Шаг стоит после публикации тега, а --verify-tag не даёт создать релиз по тегу, которого
      # на GitHub нет. Если шаг упал после push тега, релиз доводится вручную той же командой:
      # повторный запуск сценария выпустил бы уже следующую версию.
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "v$NEXT" --verify-tag --title "v$NEXT" --generate-notes
